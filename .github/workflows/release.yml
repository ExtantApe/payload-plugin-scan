# Release: pushing a version tag (vX.Y.Z) builds, tests and *stages* the package on npm.
# Nothing goes public until the npm account that owns the extantape org approves it with 2FA
# (npmjs.com → your avatar → Staged Packages → Approve, or `npm stage approve <id>`).
# No token is stored: npm trusted publishing (OIDC) lets only this workflow stage.
name: Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - name: GitHub description matches package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }} -q .description)" = "$(node -p "require('./package.json').description")" \
            || { echo "::error::GitHub's description differs from package.json: set it with gh repo edit --description from package.json, then re-tag."; exit 1; }
      - name: Tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      # prepublishOnly (typecheck, tests) and prepack (build) run as for npm publish.
      - name: Stage on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in *-*) TAG=next ;; *) TAG=latest ;; esac
          npm stage publish --access public --provenance --tag "$TAG"
